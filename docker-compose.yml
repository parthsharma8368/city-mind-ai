# API + dashboard. Ports are published on host loopback only.
# Needs artifacts/ and data/ on the host (metrics, scenario JSON, trajectories); see docs/MODELS.md.
services:
  api:
    build: { context: ., target: api }
    env_file: [{ path: .env, required: false }]
    environment:
      CITYMIND_CORS_ORIGINS: ${CITYMIND_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}/api
        VITE_WS_URL: ws://localhost:${API_PORT:-8000}/ws/simulation
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    depends_on: [api]
    restart: unless-stopped
