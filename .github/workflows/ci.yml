name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: catches upstream dependency drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (CPU torch, SUMO wheel, pinned via requirements.lock)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -c requirements.lock -e ".[dev,sumo]"
      - name: Export SUMO_HOME (eclipse-sumo wheel)
        run: echo "SUMO_HOME=$(python -c 'import sumo; print(sumo.SUMO_HOME)')" >> "$GITHUB_ENV"
      - name: Ruff
        run: ruff check .
      - name: Mypy (non-blocking baseline; see docs/CONTRIBUTING)
        continue-on-error: true
        run: mypy src api
      - name: Pytest (no SUMO scenario data needed)
        run: pytest -q

  frontend:
    name: Frontend (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --disable-pip || true
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev || true

  docker-lint:
    name: Compose / Dockerfile syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
