[project]
name = "citymind-ai"
version = "0.1.0"
description = "Centralized Reinforcement Learning for Network-Wide Traffic Signal Control using InTAS and SUMO"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "CityMind AI Team" }
]
dependencies = [
    "gymnasium>=1.0.0",
    "stable-baselines3[extra]>=2.3.0",
    "torch>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "tensorboard>=2.16.0",
    "traci>=1.20.0",
    "sumolib>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
