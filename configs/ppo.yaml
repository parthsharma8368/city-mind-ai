# ─── PPO Hyperparameters (Stable-Baselines3) ─────────────────────────────────
algorithm: PPO
device: cpu               # MlpPolicy runs faster on CPU than MPS (SB3 recommendation)

# ── Training budget ────────────────────────────────────────────────────────────
# episode_duration is 3600s (environment.yaml `sumo.end`), decision_interval is
# 5s -> one real episode is 720 decision steps, NOT 120. (The old comment here
# assumed a 600s episode that isn't what's actually configured anywhere — a
# stale assumption, not a deliberate choice.)
# 500K steps ~= ~694 episodes of 720 steps each.
total_timesteps: 500000

# ── Rollout buffer ─────────────────────────────────────────────────────────────
# The 500k-step run evaluated on 2026-09-18 used n_steps=120 — 1/6 of one real
# (720-step) episode, not "one episode" as the old comment intended — and
# showed extreme update-to-update noise (train/approx_kl swinging between
# 0.01 and 1.6 within the first 30 episodes) while rollout/ep_rew_mean stayed
# flat for the entire run and train/clip_fraction collapsed to ~0 by ~25% of
# training — the optimizer effectively stopped taking real steps. 1440 = 2
# full episodes per rollout: corrects the episode-length mismatch and gives
# each update a less noisy advantage estimate. This trades rollout wall-clock
# for sample quality, not total training wall-clock (total env steps for a
# given total_timesteps is unchanged).
n_steps: 1440
batch_size: 360           # 25% of rollout per mini-batch
n_epochs: 10              # PPO update passes per rollout

# ── Discount & advantage ───────────────────────────────────────────────────────
gamma: 0.99
gae_lambda: 0.95
normalize_advantage: true

# ── PPO clipping ───────────────────────────────────────────────────────────────
clip_range: 0.2
clip_range_vf: null

# ── Loss coefficients ──────────────────────────────────────────────────────────
ent_coef: 0.01            # entropy bonus — encourages exploration early
vf_coef: 0.5
max_grad_norm: 0.5

# ── Learning rate ──────────────────────────────────────────────────────────────
learning_rate: 3.0e-4     # constant LR; reduce to 1e-4 after first run

# ── Policy network ─────────────────────────────────────────────────────────────
policy: MlpPolicy
policy_kwargs:
  net_arch:
    - 256
    - 256
  activation_fn: tanh

# ── Artifacts ──────────────────────────────────────────────────────────────────
save_checkpoints: true
checkpoint_freq: 50000    # save every 50K steps (~10 checkpoints total)
tensorboard_log: artifacts/tb_logs
