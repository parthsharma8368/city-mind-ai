# ─── PPO Diagnostic Run ────────────────────────────────────────────────────────
# Same hyperparameters as ppo.yaml (corrected n_steps + environment.yaml's new
# switching_penalty), but a much smaller budget: the previous 500k-step run's
# pathology (flat reward, clip_fraction -> 0) was already fully established by
# ~125k steps, so this checks whether the fixes change that *early* signature
# before committing another ~14 hours to a full run.
algorithm: PPO
device: cpu

total_timesteps: 120000

n_steps: 1440
batch_size: 360
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95
normalize_advantage: true

clip_range: 0.2

ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

learning_rate: 3.0e-4

policy: MlpPolicy
policy_kwargs:
  net_arch:
    - 256
    - 256
  activation_fn: tanh

checkpoint_freq: 30000
tensorboard_log: artifacts/tb_logs
