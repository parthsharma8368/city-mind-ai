# ─── Fast PPO Training Profile (5 full episodes = 3,600 steps) ───────────────
algorithm: PPO
device: cpu

# 3,600 steps = 5 full InTAS episodes of 720 steps each (~12 minutes with TraCI optimizations)
total_timesteps: 3600
n_steps: 720
batch_size: 180
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95
normalize_advantage: true
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
learning_rate: 3.0e-4

policy: MlpPolicy
policy_kwargs:
  net_arch:
    - 256
    - 256
  activation_fn: tanh

checkpoint_freq: 720
