# ─── IPPO smoke-test config ───────────────────────────────────────────────
# Not a real training run — verifies the env/policy/training loop actually
# runs end-to-end (correct observation shape, no crashes, a sane reward
# signal) before committing to the full 50,000,000-timestep run in
# ippo.yaml. Mirrors ppo_test.yaml's role for the centralized agent.
#
# n_steps=5 x 98 agents = 490-sample rollout; total_timesteps=980 -> 2
# policy updates. batch_size=98 divides 490 evenly (5 minibatches).
# num_vec_envs=2 (2026-09-21): also exercises the multi-instance SuperSuit
# path (2 separate SUMO subprocesses, see make_ippo_env's docstring) before
# any real multi-instance training run — n_envs becomes 98*2=196, rollout
# = 5*196=980, batch_size=98 still divides evenly (10 minibatches).
algorithm: PPO
device: cpu

total_timesteps: 1960
n_steps: 5
batch_size: 98
n_epochs: 2
num_vec_envs: 2

gamma: 0.99
gae_lambda: 0.95
normalize_advantage: true

clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

learning_rate: 3.0e-4

policy: MlpPolicy
policy_kwargs:
  net_arch:
    - 256
    - 256
  activation_fn: tanh

save_checkpoints: true
checkpoint_freq: 490
