# ─── SUMO / Simulator — SMOKE-TEST window ─────────────────────────────────────
# Mirrors environment.yaml exactly except begin/end: midnight (fast, ~13s
# pure-SUMO per episode) instead of the 07:00-08:00 peak (~100s+), and a
# short 600s duration — for verifying the training loop runs end-to-end
# (correct shapes, multi-instance SuperSuit plumbing, no crashes) before
# committing to a real run against environment.yaml. Not used for any
# reported result.
sumo:
  binary: sumo
  scenario_dir: data/raw/intas
  net_file: null
  route_files: []
  additional_files: []
  step_length: 1.0
  begin: 0
  end: 600
  no_warnings: true
  lateral_resolution: 0.0

decision_interval: 5

observation:
  lane_features:
    - queue_length
    - vehicle_count
    - mean_speed
    - density
  signal_features:
    - phase_index
    - phase_elapsed
  global_features:
    - total_vehicles
    - total_waiting_time
  normalize: true
  max_lane_vehicles: 50
  max_speed: 13.9

action:
  type: MultiBinary

safety:
  min_green: 5
  max_green: 60
  yellow_duration: 3
  all_red_duration: 1
  min_red: 0

reward:
  waiting_delta_weight: 1.0
  queue_weight: 0.0
  switching_penalty: 0.3
  spillback_weight: 0.2
  pressure_weight: 0.0

termination:
  max_steps: null
  on_collision: false
