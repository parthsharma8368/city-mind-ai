# ─── IPPO phase-selection smoke-test config ──────────────────────────────
# Not a real training run — verifies the phase-selection env/mask/policy/
# training loop actually runs end-to-end (correct observation shape,
# correct action masking, no crashes, a sane reward signal) before
# committing to a real run. Mirrors ippo_test.yaml's role for the original
# binary-action IPPO agent.
#
# num_vec_envs MUST be 1: MaskablePPO's get_action_masks() calls
# env.env_method("action_masks"), which SuperSuit's ProcConcatVec (the
# multi-instance parallel wrapper, num_vec_envs>1) does not implement —
# only single-instance training can be masked right now. See
# src/agents/ippo_maskable_agent.py's module docstring for the integration
# gap and options for lifting this limit.
algorithm: MaskablePPO
device: cpu
num_vec_envs: 1

# n_steps=5 x 98 agents = 490-sample rollout; total_timesteps=980 -> 2
# policy updates. batch_size=98 divides 490 evenly (5 minibatches).
total_timesteps: 980
n_steps: 5
batch_size: 98
n_epochs: 2

gamma: 0.99
gae_lambda: 0.95
normalize_advantage: true

clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

learning_rate: 3.0e-4

policy: MlpPolicy
policy_kwargs:
  net_arch:
    - 256
    - 256
  activation_fn: tanh

checkpoint_freq: 490
tensorboard_log: artifacts/tb_logs
