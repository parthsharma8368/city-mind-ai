algorithm: PPO
device: auto

total_timesteps: 128
n_steps: 64
batch_size: 32
n_epochs: 2
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
learning_rate: 3.0e-4
normalize_advantage: true

policy: MlpPolicy
policy_kwargs:
  net_arch:
    - 256
    - 256
  activation_fn: tanh

save_checkpoints: true
checkpoint_freq: 64
