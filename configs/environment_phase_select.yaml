# ─── SUMO / Simulator ────────────────────────────────────────────────────────
# RL-strategy Phase 2: IPPO-only fork of environment.yaml for the
# phase-selection action space. Kept as a SEPARATE file rather than editing
# environment.yaml in place because PPOAgent (centralized, still on the
# original binary action space) reads environment.yaml's reward.* section
# too — zeroing waiting_delta_weight there would silently change PPO's
# reward as a side effect of an IPPO-only change. Everything below is
# identical to environment.yaml except action/reward (see those sections).
sumo:
  binary: sumo
  scenario_dir: data/raw/intas
  net_file: null
  route_files: []
  additional_files: []
  step_length: 1.0
  begin: 25200            # 07:00:00
  end: 28800               # 08:00:00 (1-hour episode) — same peak window as environment.yaml
  no_warnings: true
  lateral_resolution: 0.0

decision_interval: 5

observation:
  lane_features:
    - queue_length
    - vehicle_count
    - mean_speed
    - density
  signal_features:
    - phase_index
    - phase_elapsed
  global_features:
    - total_vehicles
    - total_waiting_time
  normalize: true
  max_lane_vehicles: 50
  max_speed: 13.9

# ─── Action Space ────────────────────────────────────────────────────────────
action:
  # RL-strategy Phase 2: replaces the binary keep(0)/advance-to-next(1)
  # action (environment.yaml) — that action space cannot express "skip an
  # empty movement to serve a saturated one," which the RL-strategy memo
  # identified as the fault capping every trained policy at the same ~4.0s
  # band regardless of algorithm (Max-Pressure, a provably throughput-
  # optimal policy, hit the same ceiling under the same action space).
  # Action i selects this TLS's own i-th green phase (TLSSpec.
  # action_to_phase_index); TLS with fewer than MAX_GREEN_PHASES=6 green
  # phases have the extra slots masked out via MaskablePPO — see
  # DecentralizedSumoEnv.action_masks() and src/agents/ippo_maskable_agent.py.
  type: Discrete_per_agent_phase_select
  max_green_phases: 6

# ─── Safety Layer ────────────────────────────────────────────────────────────
# Unchanged from environment.yaml — see that file's comment for the
# min_green/max_green fallback rationale. The phase-selection action still
# goes through SafetyLayer (mode="phase_select"): adjacent-next-green
# targets reuse the exact native transition environment.yaml's config
# describes; a jump to a non-adjacent green uses a synthesized all-red
# bridge instead (safety.py's _build_bridge_queue) — never an invented
# shortcut around min/max green or clearance timing.
safety:
  min_green: 5
  max_green: 60
  yellow_duration: 3
  all_red_duration: 1
  min_red: 0

# ─── Reward ──────────────────────────────────────────────────────────────────
# RL-strategy Phase 2, REVISED 2026-09-24 after gate G1's first result
# (7,716 trips / 5,853 backlog / 1,817 teleports per episode — worse than
# every baseline, worse than the old binary-action IPPO). Diagnosed
# directly against that run: pressure_weight alone used AGGREGATE
# intersection pressure, which doesn't move in any agent-attributable way
# when the policy switches phases — a 6-phase TLS was observed sitting on
# an empty phase for 15 real minutes while a different phase's own
# pressure climbed from 6 to 9+, because switching_penalty (0.3, applied
# every single step) was the only term that clearly rewarded NOT acting.
#
# neglected_pressure_weight is the fix: penalizes the worst pressure among
# this TLS's own green phases OTHER than whichever is currently active —
# directly, per-step, whether or not the policy switches — so ignoring a
# growing queue elsewhere is no longer free. waiting_delta_weight is
# restored (was zeroed) so actual service outcomes still matter, not just
# the pressure proxy; switching_penalty is cut 6x (0.3 -> 0.05) so it no
# longer dominates the per-step reward and fights the corrective switches
# neglected_pressure_weight is trying to encourage. pressure_weight itself
# is reduced to a secondary role rather than removed — it still penalizes
# genuine upstream/downstream imbalance, just no longer as the one term
# expected to carry all of the signal.
reward:
  waiting_delta_weight: 0.3
  queue_weight: 0.0
  switching_penalty: 0.05
  spillback_weight: 0.2
  pressure_weight: 0.3
  neglected_pressure_weight: 1.0

# ─── Episode Termination ─────────────────────────────────────────────────────
termination:
  max_steps: null
  on_collision: false
