# ─── SUMO / Simulator ────────────────────────────────────────────────────────
# RL-strategy Phase 2: IPPO-only fork of environment.yaml for the
# phase-selection action space. Kept as a SEPARATE file rather than editing
# environment.yaml in place because PPOAgent (centralized, still on the
# original binary action space) reads environment.yaml's reward.* section
# too — zeroing waiting_delta_weight there would silently change PPO's
# reward as a side effect of an IPPO-only change. Everything below is
# identical to environment.yaml except action/reward (see those sections).
sumo:
  binary: sumo
  scenario_dir: data/raw/intas
  net_file: null
  route_files: []
  additional_files: []
  step_length: 1.0
  begin: 25200            # 07:00:00
  end: 28800               # 08:00:00 (1-hour episode) — same peak window as environment.yaml
  no_warnings: true
  lateral_resolution: 0.0

decision_interval: 5

observation:
  lane_features:
    - queue_length
    - vehicle_count
    - mean_speed
    - density
  signal_features:
    - phase_index
    - phase_elapsed
  global_features:
    - total_vehicles
    - total_waiting_time
  normalize: true
  max_lane_vehicles: 50
  max_speed: 13.9

# ─── Action Space ────────────────────────────────────────────────────────────
action:
  # RL-strategy Phase 2: replaces the binary keep(0)/advance-to-next(1)
  # action (environment.yaml) — that action space cannot express "skip an
  # empty movement to serve a saturated one," which the RL-strategy memo
  # identified as the fault capping every trained policy at the same ~4.0s
  # band regardless of algorithm (Max-Pressure, a provably throughput-
  # optimal policy, hit the same ceiling under the same action space).
  # Action i selects this TLS's own i-th green phase (TLSSpec.
  # action_to_phase_index); TLS with fewer than MAX_GREEN_PHASES=6 green
  # phases have the extra slots masked out via MaskablePPO — see
  # DecentralizedSumoEnv.action_masks() and src/agents/ippo_maskable_agent.py.
  type: Discrete_per_agent_phase_select
  max_green_phases: 6

# ─── Safety Layer ────────────────────────────────────────────────────────────
# Unchanged from environment.yaml — see that file's comment for the
# min_green/max_green fallback rationale. The phase-selection action still
# goes through SafetyLayer (mode="phase_select"): adjacent-next-green
# targets reuse the exact native transition environment.yaml's config
# describes; a jump to a non-adjacent green uses a synthesized all-red
# bridge instead (safety.py's _build_bridge_queue) — never an invented
# shortcut around min/max green or clearance timing.
safety:
  min_green: 5
  max_green: 60
  yellow_duration: 3
  all_red_duration: 1
  min_red: 0

# ─── Reward ──────────────────────────────────────────────────────────────────
# RL-strategy Phase 2: pressure-primary, waiting-delta OFF. The RL-strategy
# memo's second diagnosed fault — a policy rewarded on network-wide
# waiting-time delta learned that rapid cycling resets the counters it's
# scored on (40k+ switches/hour measured under this same reward with the
# OLD action space) — isn't fixed by changing the action space alone; the
# objective has to stop rewarding that degenerate solution. Pressure
# (local_reward.py's already-implemented, already-unit-tested ablation arm)
# is bounded, dense, contains the downstream coupling the hand-built
# spillback term approximated, and is the objective Max-Pressure is
# provably throughput-optimal under — the property the waiting-delta
# reward lacks. spillback_weight/switching_penalty are left at
# environment.yaml's values (secondary terms, not the primary signal).
reward:
  waiting_delta_weight: 0.0
  queue_weight: 0.0
  switching_penalty: 0.3
  spillback_weight: 0.2
  pressure_weight: 1.0

# ─── Episode Termination ─────────────────────────────────────────────────────
termination:
  max_steps: null
  on_collision: false
