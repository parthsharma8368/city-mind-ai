# ─── IPPO (parameter-shared) Hyperparameters ─────────────────────────────────
# One shared policy, invoked once per TLS per decision step (98 agents/step,
# one SUMO instance). SB3 counts total_timesteps across all agents, so one
# real decision step of simulation contributes ~98 to the counter — the
# same total_timesteps budget as the centralized run covers far fewer real
# simulated seconds, but with 98x the (obs, action, reward) samples per
# gradient step and — the actual point of this design — a reward that's
# attributable to the specific agent that earned it.
algorithm: PPO
device: cpu

# n_steps=720 (one real episode) x 98 agents = 70,560-sample rollout per
# update. This is the real run (2026-09-19), not another short diagnostic:
# total_timesteps=50,000,000 -> ~510,000 real decision steps -> ~708 real
# episodes, comparable in real-episode count to the centralized run's 694,
# but with a 70,560-sample batch per update instead of 1,440. checkpoint_freq
# saves every ~14 real episodes so progress can be evaluated from a live
# checkpoint without ever stopping this process.
total_timesteps: 50000000
n_steps: 720
batch_size: 8820          # 70,560 / 8
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95
normalize_advantage: true

clip_range: 0.2
clip_range_vf: null

ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

learning_rate: 3.0e-4

policy: MlpPolicy
policy_kwargs:
  net_arch:
    - 256
    - 256
  activation_fn: tanh

save_checkpoints: true
checkpoint_freq: 1000000
tensorboard_log: artifacts/tb_logs
