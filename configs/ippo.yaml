# CityMind - PPO hyper-parameters (Stable-Baselines3) for the parameter-shared IPPO agent.
# One shared policy acts at all 98 intersections; 6 parallel SUMO instances -> 98 x 6 = 588 "environments" per step.
# Samples per update = n_steps x 588 = 105,840; total_timesteps / 105,840 = number of PPO updates (100).
algorithm: PPO
device: cpu
total_timesteps: 10584000
n_steps: 180                 # 4 updates per simulated hour
batch_size: 13230            # 105,840 / 8 minibatches
n_epochs: 10
num_vec_envs: 6

gamma: 0.99
gae_lambda: 0.95
normalize_advantage: true
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
split_clip: true             # clip the actor's and the critic's gradient norms separately (src/agents/split_clip.py)
learning_rate: 3.0e-4

policy: MlpPolicy
policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

checkpoint_freq: 1058400     # a checkpoint every 10 updates
tensorboard_log: artifacts/tb_logs
