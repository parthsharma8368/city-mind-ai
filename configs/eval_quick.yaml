# Quick/smoke-test evaluation protocol — only the keys below are actually
# read by EvaluationRunner (src/evaluation/evaluate.py); see evaluation.yaml.
decision_interval: 5
demand_scales:
- 1.0
episode_duration: 1800
output_dir: artifacts/metrics
report_dir: artifacts/reports
save_trajectories: true
seeds:
- 42
trajectory_dir: artifacts/trajectories
trajectory_interval: 1
