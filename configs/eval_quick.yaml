# Quick/smoke-test evaluation protocol — see evaluation.yaml for the keys read
# by EvaluationRunner. This window is non-canonical, so results are redirected to
# artifacts/metrics/runs/b0_d1800/ (never the published peak-hour artifacts).
# No begin_time set -> defaults to 0 (midnight): intentional here, purely
# for a fast sanity check (low traffic = short episodes), NOT a result to
# report. Use evaluation.yaml (peak hour) for anything that gets reported.
demand_scales:
- 1.0
episode_duration: 1800
output_dir: artifacts/metrics
report_dir: artifacts/reports
seeds:
- 42
trajectory_dir: artifacts/trajectories
