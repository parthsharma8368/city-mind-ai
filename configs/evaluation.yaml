# ─── Evaluation Protocol ─────────────────────────────────────────────────────
# Keys read by EvaluationRunner (src/evaluation/evaluate.py):
#   seeds, demand_scales, begin_time, episode_duration   the protocol itself
#   output_dir, trajectory_dir   defaults, overridden by --output-dir/--trajectory-dir.
#                                A NON-canonical window (anything but 25200 + 3600) is
#                                redirected to <dir>/runs/b<begin>_d<duration>/ so it
#                                cannot replace the published peak-hour artifacts.
#   report_dir                   comparison plots (run_evaluation.py --plot)
# Which controllers run and their model paths come from run_evaluation.py's CLI
# flags (--controllers, --ppo-model, --ippo-model, --phase-select-model), not
# from this file. The decision interval is a property of each controller/env
# (decision_interval=5; see environment*.yaml), not read here. Results of a
# different configuration are never overwritten without --overwrite.

seeds:
  - 42
  - 123
  - 777

demand_scales:
  - 1.0                    # Week 1: single demand level
  # Post-week expansion:
  # - 0.75
  # - 1.25
  # - 1.5

# Episode settings (mirrors environment.yaml)
# begin_time is the absolute sim-time the episode starts at; episode_duration
# is a DURATION added to it (2026-09-21: moved from midnight, 0-3600s, to the
# 07:00-08:00 morning peak — see environment.yaml's sumo.begin/end comment
# for the measured reason). Use configs/evaluation_midnight.yaml for the
# original low-traffic window (historical comparison only).
begin_time: 25200          # 07:00:00
episode_duration: 3600     # seconds (1 hour)

# Output
output_dir: artifacts/metrics
trajectory_dir: artifacts/trajectories
report_dir: artifacts/reports
