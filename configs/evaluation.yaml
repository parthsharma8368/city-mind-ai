# ─── Evaluation Protocol ─────────────────────────────────────────────────────
# Only the keys below are actually read by EvaluationRunner
# (src/evaluation/evaluate.py) — which controllers run and what model paths
# they use come from run_evaluation.py's own CLI flags (--ppo-model,
# --ippo-model), not from this file.

seeds:
  - 42
  - 123
  - 777

demand_scales:
  - 1.0                    # Week 1: single demand level
  # Post-week expansion:
  # - 0.75
  # - 1.25
  # - 1.5

# Episode settings (mirrors environment.yaml)
episode_duration: 3600     # seconds (1 hour)
decision_interval: 5

# Output
output_dir: artifacts/metrics
trajectory_dir: artifacts/trajectories
report_dir: artifacts/reports
save_trajectories: true
trajectory_interval: 1     # record every N simulation seconds
