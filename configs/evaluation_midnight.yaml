# ─── Evaluation Protocol — historical midnight window ────────────────────────
# The original evaluation window (0-3600s, i.e. midnight-1am), kept only for
# historical comparison against pre-2026-09-21 results. evaluation.yaml
# (07:00-08:00 peak) is the primary config going forward — see its comment
# and environment.yaml's sumo.begin/end comment for why: at midnight the
# network carries ~1,486 vehicles across 98 intersections (mean queue
# 0.05/lane) with essentially nothing to coordinate, and a same-day ceiling
# test showed every trained policy there converges to within 0.05s of what a
# policy-free hand rule scores — there is no more room for learning to
# matter in this window.

seeds:
  - 42
  - 123
  - 777

demand_scales:
  - 1.0

# Non-canonical window: results go to artifacts/metrics/runs/b0_d3600/ (see evaluation.yaml).
begin_time: 0               # 00:00:00 — historical window, do not use for new results
episode_duration: 3600

output_dir: artifacts/metrics
trajectory_dir: artifacts/trajectories
report_dir: artifacts/reports
